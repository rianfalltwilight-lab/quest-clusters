name: Release

# Push a tag like v0.2.0 to build that version and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain -Pmod_version="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # each released module on its own, plus the bundle (every released module in one jar)
          files=""
          for m in */gradle.properties; do
            d=$(dirname "$m")
            if grep -q '^publish=true' "$m"; then files="$files $(ls $d/build/libs/*.jar)"; fi
          done
          gh release create "$GITHUB_REF_NAME" $files \
            --title "Quest Clusters $GITHUB_REF_NAME" \
            --generate-notes
