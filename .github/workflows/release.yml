name: Release

# Push a tag like v0.2.0 to build that version and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain -Pmod_version="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # core = the quest_clusters mod; bundle = every released module in one jar (install one of the two)
          gh release create "$GITHUB_REF_NAME" core/build/libs/*.jar bundle/build/libs/*.jar \
            --title "Quest Clusters $GITHUB_REF_NAME" \
            --generate-notes
