name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: quest-clusters-${{ github.sha }}
          path: |
            core/build/libs/*.jar
            visuals/build/libs/*.jar
            editor/build/libs/*.jar
            filters/build/libs/*.jar
            xmod/build/libs/*.jar
            bundle/build/libs/*.jar
