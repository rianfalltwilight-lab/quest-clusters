apply from: rootProject.file('gradle/module.gradle')

dependencies {
    compileOnly sibling('core')
    testImplementation sibling('core')
    modCompileOnly("maven.modrinth:watermedia:${project.watermedia_version}")
    modCompileOnly("dev.latvian.mods:${ld('kubejs')}:${project.kubejs_version}")
    modCompileOnly("dev.latvian.mods:${project.rhino_artifact}:${project.rhino_version}")
}

// 1.20.1: KubeJS 6 (script events are EventJS subclasses)
stonecutter {
    if (legacy) {
        replacements.string(true) {
            replace('dev.latvian.mods.kubejs.event.KubeEvent', 'dev.latvian.mods.kubejs.event.EventJS')
            replace('implements KubeEvent', 'extends EventJS')
            replace('ImageComponent.ImageAlign.byName(', 'ImageComponent.ImageAlign.fromString(')
            // FTB Quests 2001 draws dependency lines from any widget, with a shared BufferBuilder
            replace('renderConnection(Ldev/ftb/mods/ftbquests/client/gui/quests/QuestButton;Ldev/ftb/mods/ftbquests/client/gui/quests/QuestButton;Lcom/mojang/blaze3d/vertex/PoseStack;F',
                    'renderConnection(Ldev/ftb/mods/ftblibrary/ui/Widget;Ldev/ftb/mods/ftbquests/client/gui/quests/QuestButton;Lcom/mojang/blaze3d/vertex/PoseStack;Lcom/mojang/blaze3d/vertex/BufferBuilder;F')
            replace('op.call(panel, from, to, ps, s,', 'op.call(panel, fromW, to, ps, buf, s,')
        }
    }
}
