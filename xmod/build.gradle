apply from: rootProject.file('gradle/module.gradle')

dependencies {
    compileOnly sibling('core')
    testImplementation sibling('core')
    modCompileOnly("dev.ftb.mods:${ld('ftb-filter-system')}:${project.ftb_filter_system_version}")
    modCompileOnly("dev.latvian.mods:${ld('kubejs')}:${project.kubejs_version}")
    modCompileOnly("mezz.jei:jei-${mc}-common-api:${project.jei_version}")
    modCompileOnly("mezz.jei:jei-${mc}-${project.loader}-api:${project.jei_version}")
    modCompileOnly("me.shedaniel:${ld('RoughlyEnoughItems-api')}:${project.rei_version}")
    modCompileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    modCompileOnly("me.shedaniel.cloth:${ld('cloth-config')}:${project.cloth_config_version}")
    modCompileOnly("maven.modrinth:jade:${project.jade_version}")
    if (project.guideme_version) modCompileOnly("maven.modrinth:guideme:${project.guideme_version}")
    modCompileOnly("vazkii.patchouli:Patchouli:${project.patchouli_version}:api")
    modCompileOnly("dev.latvian.mods:${project.rhino_artifact}:${project.rhino_version}")
}

// 1.20.1: KubeJS 6 (script events are EventJS subclasses), JEI 15, fluid data as NBT
stonecutter {
    if (legacy) {
        replacements.string(true) {
            replace('dev.latvian.mods.kubejs.event.KubeEvent', 'dev.latvian.mods.kubejs.event.EventJS')
            replace('implements KubeEvent', 'extends EventJS')
            replace('dev.latvian.mods.kubejs.stages.StageEvents', 'dev.latvian.mods.kubejs.stages.Stages')
            replace('StageEvents.get(', 'Stages.get(')
            // fluid data: 1.21 data components, 1.20.1 NBT
            replace('net.minecraft.core.component.DataComponentPatch', 'net.minecraft.nbt.CompoundTag')
            replace('DataComponentPatch fluidComponents', 'CompoundTag fluidComponents')
            replace('DataComponentPatch.EMPTY', '(CompoundTag) null')
            replace('getFluidDataComponentPatch()', 'getFluidNBT()')
            // JEI 15
            replace('mezz.jei.api.neoforge.NeoForgeTypes', 'mezz.jei.api.forge.ForgeTypes')
            replace('NeoForgeTypes.FLUID_STACK', 'ForgeTypes.FLUID_STACK')
        }
    }
}
