plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.latvian.dev/releases' } // KubeJS (optional integration, compile only)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // scripted UI check: boots into run/saves/devtest, runs client/DevSelfTest, quits
        clientDevtest {
            client()
            systemProperty 'quest_clusters.devtest', '00000000000000C1'
            programArguments.addAll('--quickPlaySingleplayer', 'devtest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // lets plain JUnit tests use Minecraft classes such as CompoundTag
    addModdingDependenciesTo(sourceSets.test)
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }

    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }

    localRuntime("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }

    testImplementation(platform('org.junit:junit-bom:5.11.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            ftb_quests_version_range: ftb_quests_version_range
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// resets the devtest quest book before every scripted UI run, so results are repeatable
def prepareDevtest = tasks.register('prepareDevtest', Copy) {
    from 'devtest/quests'
    into 'run/config/ftbquests/quests'
}
tasks.matching { it.name == 'runClientDevtest' }.configureEach { dependsOn prepareDevtest }

tasks.named('test') {
    useJUnitPlatform()
}
