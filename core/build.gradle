apply from: rootProject.file('gradle/module.gradle')

// Dev runs load core plus every module marked publish=true. Add others with -PdevModules=filters,xmod
// (e.g. to see their incompatibility rules refuse to start next to Certain Questing Additions / Quest Enhance).
def extraModules = ['visuals', 'editor', 'filters', 'xmod']
extraModules.each { evaluationDependsOn(":$it:$mc") }
def requested = (findProperty('devModules') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
// -PskipModules=editor leaves a published module out (e.g. to test next to Quest Enhance, which it replaces)
def skipped = (findProperty('skipModules') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
def devModules = extraModules.findAll { (project(":$it").findProperty('publish') == 'true' || requested.contains(it)) && !skipped.contains(it) }

configure(mdg) {
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // scripted UI check: boots into run/saves/devtest, runs client/DevSelfTest, quits
        clientDevtest {
            client()
            systemProperty 'quest_clusters.devtest', '00000000000000C1'
            programArguments.addAll('--quickPlaySingleplayer', 'devtest')
        }
        // screenshots every chapter of the loaded quest book (editor module); see prepareTour
        clientTour {
            client()
            systemProperty 'quest_clusters_editor.tour', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'devtest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            // one game folder per Minecraft version: core/run (1.21.1), core/run-1.20.1
            gameDirectory = new File(moduleDir, legacy ? "run-$mc" : 'run')
        }
    }

    mods {
        "${project.module_id}" {
            sourceSet sourceSets.main
        }
        devModules.each { m ->
            def p = sibling(m)
            "${p.module_id}" {
                sourceSet p.sourceSets.main
            }
        }
    }
}

dependencies {
    modCompileOnly("dev.latvian.mods:${ld('kubejs')}:${project.kubejs_version}")
    modCompileOnly("dev.latvian.mods:${project.rhino_artifact}:${project.rhino_version}")

    modRuntime("dev.architectury:${ld('architectury')}:${project.architectury_version}")
    modRuntime("dev.ftb.mods:${ld('ftb-library')}:${project.ftb_library_version}")
    modRuntime("dev.ftb.mods:${ld('ftb-teams')}:${project.ftb_teams_version}")
    modRuntime("dev.ftb.mods:${ld('ftb-quests')}:${project.ftb_quests_version}")
    if (devModules.contains('filters') && !project.hasProperty('noFfs')) {
        modRuntime("dev.ftb.mods:${ld('ftb-filter-system')}:${project.ftb_filter_system_version}")
    }
    if (project.hasProperty('withXmod')) { // FTB XMod Compat, to test the take-over of its FTB Quests part
        modRuntime("dev.ftb.mods:${ld('ftb-xmod-compat')}:${project.ftb_xmod_compat_version}")
    }
    if (project.hasProperty('withKubejs')) {
        modRuntime("dev.latvian.mods:${ld('kubejs')}:${project.kubejs_version}")
        modRuntime("dev.latvian.mods:${project.rhino_artifact}:${project.rhino_version}")
    }
    if (project.hasProperty('withJade')) {
        modRuntime("maven.modrinth:jade:${project.jade_version}")
    }
    if (project.hasProperty('withDocs')) { // GuideME (1.21.1 only) and Patchouli, for the "show docs" targets
        if (project.guideme_version) modRuntime("maven.modrinth:guideme:${project.guideme_version}")
        modRuntime(project.patchouli_runtime)
    }
    if (project.hasProperty('withRei')) { // REI instead of JEI (xmod's REI plugin)
        modRuntime("me.shedaniel:${ld('RoughlyEnoughItems')}:${project.rei_version}")
        modRuntime("me.shedaniel.cloth:${ld('cloth-config')}:${project.cloth_config_version}")
    }
    if (project.hasProperty('withJei')) {
        modRuntime("mezz.jei:jei-${mc}-${project.loader}:${project.jei_version}")
    }
}

def runDir = { String path -> new File(moduleDir, (legacy ? "run-$mc/" : 'run/') + path) }

// resets the devtest quest book (and migration state) before every scripted UI run, so results are repeatable
def prepareDevtest = tasks.register('prepareDevtest', Sync) {
    from new File(moduleDir, 'devtest/quests')
    into runDir('config/ftbquests/quests')
    // the game writes into this folder during the run; Gradle would otherwise think it is still up to date
    outputs.upToDateWhen { false }
    // FTB Quests for 1.20.1 has no language files: write the fixture's titles and descriptions into the chapters
    if (legacy) doLast { inlineLangFile(destinationDir) }
}

/** lang/en_us.snbt (FTB Quests 2101) to inline title / description fields (FTB Quests 2001). */
def inlineLangFile(File quests) {
    def lang = new File(quests, 'lang/en_us.snbt')
    if (!lang.exists()) return
    Map<String, Map<String, String>> byId = [:]
    String key = null
    List<String> list = null
    lang.eachLine { String raw ->
        def line = raw.trim()
        if (list != null) {
            if (line == ']') {
                def (id, field) = key.split('\\.')[1, 2]
                byId.computeIfAbsent(id) { [:] }[field] = '[' + list.join(', ') + ']'
                list = null
            } else if (line) {
                list << line
            }
            return
        }
        def m = line =~ /^(\w+\.[0-9A-F]+\.\w+): (.*)$/
        if (!m) return
        key = m[0][1]
        def value = m[0][2]
        if (value == '[') {
            list = []
        } else {
            def (id, field) = key.split('\\.')[1, 2]
            byId.computeIfAbsent(id) { [:] }[field] = value
        }
    }
    def names = [title: 'title', quest_subtitle: 'subtitle', quest_desc: 'description']
    new File(quests, 'chapters').eachFileMatch(~/.*\.snbt/) { File f ->
        def text = f.getText('UTF-8')
        // other field forms of FTB Quests 2001
        text = text.replace('disable_recipe_mod:', 'disable_jei:')
        text = text.replace('click_action: "none:', 'click: "')
        text = text.replaceAll(/fluid: \{ id: "([^"]+)", amount: (\d+L) \}/, 'fluid: "$1", amount: $2')
        text = text.replaceAll(/\{ id: "([^"]+)", count: (\d+), components: \{ "minecraft:custom_data": (\{[^{}]*\}) \} \}/, '{ id: "$1", Count: $2b, tag: $3 }')
        byId.each { id, fields ->
            def extra = fields.collect { k, v -> "${names[k] ?: k}: $v" }.join(', ')
            text = text.replace("id: \"$id\"", "id: \"$id\", $extra")
        }
        f.setText(text, 'UTF-8')
    }
    lang.delete()
}

// visuals: start without our settings and with Certain Questing Additions' settings, to exercise the import
def prepareVisualsDevtest = tasks.register('prepareVisualsDevtest') {
    doLast {
        // fresh run folder (new checkout, CI): without options.txt Minecraft first shows its accessibility
        // onboarding screen and only then runs quick play, which a headless run never gets past
        def options = runDir('options.txt')
        if (!options.exists()) {
            options.parentFile.mkdirs()
            // ...and no movement tutorial toast over the screenshots
            options.text = 'onboardAccessibility:false\ntutorialStep:none\n'
        }
        delete runDir('local/quest_clusters_visuals')
        runDir('local/certain_questing_additions').mkdirs()
        runDir('local/certain_questing_additions/client-config.snbt').text = '{\n\tanimations: { quest_hover: true }\n\tappearance: { quest_hover_glow_alpha: 77 }\n}\n'
    }
}
// -PtourBook=/path/to/config/ftbquests/quests: load that quest book for runClientTour (a local copy; the next
// runClientDevtest restores the fixture)
def prepareTour = tasks.register('prepareTour', Sync) {
    onlyIf { project.hasProperty('tourBook') }
    from { project.findProperty('tourBook') ?: new File(moduleDir, 'devtest/quests') }
    into runDir('config/ftbquests/quests')
    outputs.upToDateWhen { false }
}
tasks.matching { it.name == 'runClientTour' }.configureEach { dependsOn prepareTour }
// -PwithKubejs: the dev self-test's KubeJS script
def prepareKubejsDevtest = tasks.register('prepareKubejsDevtest', Sync) {
    onlyIf { project.hasProperty('withKubejs') }
    from new File(moduleDir, 'devtest/kubejs/server_scripts')
    into runDir('kubejs/server_scripts')
    outputs.upToDateWhen { false }
}
tasks.matching { it.name == 'runClientDevtest' }.configureEach { dependsOn prepareKubejsDevtest }
tasks.matching { it.name == 'runClientDevtest' }.configureEach { dependsOn prepareDevtest, prepareVisualsDevtest }
