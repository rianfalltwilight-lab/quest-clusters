apply from: rootProject.file('gradle/module.gradle')

// Dev runs load core plus every module marked publish=true. Add others with -PdevModules=filters,xmod
// (e.g. to see their incompatibility rules refuse to start next to Certain Questing Additions / Quest Enhance).
def extraModules = ['visuals', 'editor', 'filters', 'xmod']
extraModules.each { evaluationDependsOn(":$it") }
def requested = (findProperty('devModules') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
// -PskipModules=editor leaves a published module out (e.g. to test next to Quest Enhance, which it replaces)
def skipped = (findProperty('skipModules') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
def devModules = extraModules.findAll { (project(":$it").findProperty('publish') == 'true' || requested.contains(it)) && !skipped.contains(it) }

neoForge {
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // scripted UI check: boots into run/saves/devtest, runs client/DevSelfTest, quits
        clientDevtest {
            client()
            systemProperty 'quest_clusters.devtest', '00000000000000C1'
            programArguments.addAll('--quickPlaySingleplayer', 'devtest')
        }
        // screenshots every chapter of the loaded quest book (editor module); see prepareTour
        clientTour {
            client()
            systemProperty 'quest_clusters_editor.tour', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'devtest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${project.module_id}" {
            sourceSet sourceSets.main
        }
        devModules.each { m ->
            def p = project(":$m")
            "${p.module_id}" {
                sourceSet p.sourceSets.main
            }
        }
    }
}

dependencies {
    compileOnly("dev.latvian.mods:kubejs-neoforge:${rootProject.kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rootProject.rhino_version}") { transitive = false }

    localRuntime("dev.architectury:architectury-neoforge:${rootProject.architectury_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-library-neoforge:${rootProject.ftb_library_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-teams-neoforge:${rootProject.ftb_teams_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-quests-neoforge:${rootProject.ftb_quests_version}") { transitive = false }
    if (devModules.contains('filters') && !project.hasProperty('noFfs')) {
        localRuntime("dev.ftb.mods:ftb-filter-system-neoforge:${rootProject.ftb_filter_system_version}") { transitive = false }
    }
    if (project.hasProperty('withXmod')) { // FTB XMod Compat, to test the take-over of its FTB Quests part
        localRuntime("dev.ftb.mods:ftb-xmod-compat-neoforge:${rootProject.ftb_xmod_compat_version}") { transitive = false }
    }
    if (project.hasProperty('withKubejs')) {
        localRuntime("dev.latvian.mods:kubejs-neoforge:${rootProject.kubejs_version}") { transitive = false }
        localRuntime("dev.latvian.mods:rhino:${rootProject.rhino_version}") { transitive = false }
    }
    if (project.hasProperty('withJei')) {
        localRuntime("mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}") { transitive = false }
    }
}

// resets the devtest quest book (and migration state) before every scripted UI run, so results are repeatable
def prepareDevtest = tasks.register('prepareDevtest', Sync) {
    from 'devtest/quests'
    into 'run/config/ftbquests/quests'
    // the game writes into this folder during the run; Gradle would otherwise think it is still up to date
    outputs.upToDateWhen { false }
}
// visuals: start without our settings and with Certain Questing Additions' settings, to exercise the import
def prepareVisualsDevtest = tasks.register('prepareVisualsDevtest') {
    doLast {
        delete 'run/local/quest_clusters_visuals'
        file('run/local/certain_questing_additions').mkdirs()
        file('run/local/certain_questing_additions/client-config.snbt').text = '{\n\tanimations: { quest_hover: true }\n\tappearance: { quest_hover_glow_alpha: 77 }\n}\n'
    }
}
// -PtourBook=/path/to/config/ftbquests/quests: load that quest book for runClientTour (a local copy; the next
// runClientDevtest restores the fixture)
def prepareTour = tasks.register('prepareTour', Sync) {
    onlyIf { project.hasProperty('tourBook') }
    from { project.findProperty('tourBook') ?: 'devtest/quests' }
    into 'run/config/ftbquests/quests'
    outputs.upToDateWhen { false }
}
tasks.matching { it.name == 'runClientTour' }.configureEach { dependsOn prepareTour }
// -PwithKubejs: the dev self-test's KubeJS script
def prepareKubejsDevtest = tasks.register('prepareKubejsDevtest', Sync) {
    onlyIf { project.hasProperty('withKubejs') }
    from 'devtest/kubejs/server_scripts'
    into 'run/kubejs/server_scripts'
    outputs.upToDateWhen { false }
}
tasks.matching { it.name == 'runClientDevtest' }.configureEach { dependsOn prepareKubejsDevtest }
tasks.matching { it.name == 'runClientDevtest' }.configureEach { dependsOn prepareDevtest, prepareVisualsDevtest }
