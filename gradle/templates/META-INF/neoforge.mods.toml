modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/rianfalltwilight-lab/quest-clusters/issues"

[[mods]]
modId = "${module_id}"
version = "${mod_version}"
displayName = "${module_name}"
displayTest = "${display_test}"
authors = "${mod_authors}"
description = '''
${module_description}
'''

[[mixins]]
config = "${module_id}.mixins.json"

[[dependencies.${module_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${module_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${module_id}]]
modId = "ftbquests"
type = "required"
versionRange = "${ftb_quests_version_range}"
ordering = "AFTER"
side = "BOTH"
${extra_dependencies}
