// Applied by every mod module: NeoForge setup, FTB dependencies, metadata generation.
apply plugin: 'java-library'
apply plugin: 'idea'
apply plugin: 'net.neoforged.moddev'

base {
    archivesName = project.module_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.latvian.dev/releases' } // KubeJS (optional integration, compile only)
    maven { // JEI (optional, compile only)
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven { // WATERMeDIA, EMI (optional, compile only)
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = rootProject.neo_version
    // lets plain JUnit tests use Minecraft classes such as CompoundTag
    addModdingDependenciesTo(sourceSets.test)
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("dev.architectury:architectury-neoforge:${rootProject.architectury_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${rootProject.ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${rootProject.ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${rootProject.ftb_quests_version}") { transitive = false }

    // FTB Library's SNBT reader/writer is used by code under test
    testImplementation("dev.ftb.mods:ftb-library-neoforge:${rootProject.ftb_library_version}") { transitive = false }
    testImplementation(platform('org.junit:junit-bom:5.11.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

def depsFile = file('extra-dependencies.toml')
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            minecraft_version_range : rootProject.minecraft_version_range,
            neo_version_range       : rootProject.neo_version_range,
            loader_version_range    : rootProject.loader_version_range,
            mod_license             : rootProject.mod_license,
            mod_version             : rootProject.mod_version,
            mod_authors             : rootProject.mod_authors,
            ftb_quests_version_range: rootProject.ftb_quests_version_range,
            module_id               : project.module_id,
            module_name             : project.module_name,
            module_description      : project.module_description,
            // client-only modules use IGNORE_ALL_VERSION so servers don't need them
            display_test            : project.findProperty('display_test') ?: 'MATCH_VERSION',
            // placeholders inside the inserted text are not expanded by the template engine: resolve them here
            extra_dependencies      : depsFile.exists() ? depsFile.getText('UTF-8')
                    .replace('${module_id}', project.module_id).replace('${mod_version}', rootProject.mod_version) : ''
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    expand props
    from rootProject.file('gradle/templates')
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { showStandardStreams = true }
    // optional local-only fixture (a private quest book): -PlegacyBook=/path/to/config/ftbquests/quests
    if (project.hasProperty('legacyBook')) {
        systemProperty 'quest_clusters.legacyBook', project.property('legacyBook')
        outputs.upToDateWhen { false }
    }
}
