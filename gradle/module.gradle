// Applied by every mod module, once per Minecraft version (project :<module>:<version>, folder
// <module>/versions/<version>; sources are shared in <module>/src). 1.21.1 builds with NeoForge, 1.20.1 with
// MinecraftForge (ModDevGradle's legacy plugin: SRG reobfuscation, Mixin refmaps, MixinExtras nested).
apply plugin: 'java-library'
apply plugin: 'idea'

def mc = stonecutter.current.version
def legacy = mc == '1.20.1'

// versions/<mc>/gradle.properties: loader, Minecraft and dependency versions (-P on the command line still wins)
def versionProps = new Properties()
rootProject.file("versions/$mc/gradle.properties").withInputStream { versionProps.load(it) }
versionProps.each { k, v -> if (!project.hasProperty(k)) project.ext.set(k, v) }

ext.mc = mc
ext.legacy = legacy
/** The module's folder (the shared one, not versions/<mc>). */
ext.moduleDir = project.parent.projectDir
/** Same module, other module or the bundle, for this Minecraft version. */
ext.sibling = { String name -> project(":$name:$mc") }

// every versioned project is named after its version ("1.21.1"): a per-module group keeps their coordinates apart
group = "${rootProject.mod_group_id}.${project.parent.name}"
version = "${mc}-${rootProject.mod_version}"

apply plugin: legacy ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'
/** neoForge { } or legacyForge { } */
ext.mdg = extensions.getByName(legacy ? 'legacyForge' : 'neoForge')

stonecutter {
    constants.match(legacy ? 'forge' : 'neoforge', 'forge', 'neoforge')
    if (legacy) {
        // Shared sources are written for 1.21.1 / NeoForge. On 1.20.1 these names are rewritten before compiling:
        // Forge's packages with the same classes, and backports of 1.21 networking types (core/src/forge).
        replacements.string(true) {
            replace('net.minecraft.network.codec.', 'com.questclusters.compat.codec.')
            replace('net.minecraft.network.protocol.common.custom.CustomPacketPayload', 'com.questclusters.compat.net.CustomPacketPayload')
            replace('RegistryFriendlyByteBuf', 'FriendlyByteBuf')
            replace('net.neoforged.api.distmarker.', 'net.minecraftforge.api.distmarker.')
            replace('net.neoforged.bus.api.', 'net.minecraftforge.eventbus.api.')
            replace('net.neoforged.fml.common.EventBusSubscriber', 'net.minecraftforge.fml.common.Mod.EventBusSubscriber')
            replace('net.neoforged.fml.common.Mod', 'net.minecraftforge.fml.common.Mod')
            replace('net.neoforged.fml.ModList', 'net.minecraftforge.fml.ModList')
            replace('net.neoforged.fml.ModContainer', 'net.minecraftforge.fml.ModContainer')
            replace('net.neoforged.fml.loading.', 'net.minecraftforge.fml.loading.')
            replace('net.neoforged.fml.event.', 'net.minecraftforge.fml.event.')
            replace('net.neoforged.fml.config.', 'net.minecraftforge.fml.config.')
            replace('net.neoforged.neoforge.client.event.', 'net.minecraftforge.client.event.')
            replace('net.neoforged.neoforge.event.', 'net.minecraftforge.event.')
            replace('net.neoforged.neoforge.server.', 'net.minecraftforge.server.')
            replace('net.neoforged.neoforge.fluids.', 'net.minecraftforge.fluids.')
            // longer names first: overlapping replacements are not applied to each other's output
            replace('net.neoforged.neoforge.common.NeoForge', 'net.minecraftforge.common.MinecraftForge')
            replace('net.neoforged.neoforge.common.', 'net.minecraftforge.common.')
            replace('NeoForge.EVENT_BUS', 'MinecraftForge.EVENT_BUS')
            replace('ModConfigSpec', 'ForgeConfigSpec')
            replace('ItemStack.isSameItemSameComponents(', 'ItemStack.isSameItemSameTags(')
            // FTB Library 2001 keeps the image pickers one package up
            replace('dev.ftb.mods.ftblibrary.config.ui.resource.', 'dev.ftb.mods.ftblibrary.config.ui.')
        }
        // Minecraft 1.20.2 added horizontal scrolling: mouseScrolled(x, y, dx, dy) is mouseScrolled(x, y, dy) here
        replacements.regex(true) {
            replace('public boolean mouseScrolled\\(double (\\w+), double (\\w+), double \\w+, double (\\w+)\\)',
                    'public boolean mouseScrolled(double $1, double $2, double $3)',
                    'public boolean mouseScrolled\\(double (\\w+), double (\\w+), double (\\w+)\\)',
                    'public boolean mouseScrolled(double $1, double $2, double dx, double $3)')
        }
        replacements.regex(true) {
            replace('super\\.mouseScrolled\\((\\w+), (\\w+), \\w+, (\\w+)\\)', 'super.mouseScrolled($1, $2, $3)',
                    'super\\.mouseScrolled\\((\\w+), (\\w+), (\\w+)\\)', 'super.mouseScrolled($1, $2, 0, $3)')
        }
    }
}

// Whole files that exist for one loader only (backports, loader glue) live in <module>/src/<loader>/java, so they
// are plain Java; small differences inside shared files use //? if forge { ... } comments.
sourceSets.main.java.srcDir(new File(moduleDir, "src/${project.loader}/java"))
sourceSets.main.resources.srcDir(new File(moduleDir, "src/${project.loader}/resources"))

base {
    archivesName = project.module_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(legacy ? 17 : 21)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.latvian.dev/releases' } // KubeJS (optional integration, compile only)
    maven { // JEI, Patchouli (optional, compile only)
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei'; includeGroup 'vazkii.patchouli' }
    }
    maven { // REI (optional, compile only)
        url = 'https://maven.shedaniel.me'
        content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' }
    }
    maven { // WATERMeDIA, EMI, Jade (optional, compile only)
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configure(mdg) {
    if (legacy) {
        version = project.forge_version
    } else {
        version = project.neo_version
    }
    // lets plain JUnit tests use Minecraft classes such as CompoundTag
    addModdingDependenciesTo(sourceSets.test)
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

/**
 * Mod dependencies. On 1.20.1 mods are published with SRG names and go through the remapping configurations
 * (modCompileOnly etc.); on 1.21.1 they are used as they are.
 */
ext.modCompileOnly = { String notation -> dependencies.add(legacy ? 'modCompileOnly' : 'compileOnly', notation) { transitive = false } }
ext.modRuntime = { String notation -> dependencies.add(legacy ? 'modRuntimeOnly' : 'localRuntime', notation) { transitive = false } }
ext.modTest = { String notation -> dependencies.add(legacy ? 'modTestImplementation' : 'testImplementation', notation) { transitive = false } }
/** Artifact name with the loader suffix: ftb-quests-neoforge / ftb-quests-forge */
ext.ld = { String artifact -> "$artifact-${project.loader}" }

if (legacy) {
    obfuscation {
        createRemappingConfiguration(configurations.testImplementation)
    }
}

dependencies {
    modCompileOnly("dev.architectury:${ld('architectury')}:${project.architectury_version}")
    modCompileOnly("dev.ftb.mods:${ld('ftb-library')}:${project.ftb_library_version}")
    modCompileOnly("dev.ftb.mods:${ld('ftb-teams')}:${project.ftb_teams_version}")
    modCompileOnly("dev.ftb.mods:${ld('ftb-quests')}:${project.ftb_quests_version}")

    // FTB Library's SNBT reader/writer is used by code under test
    modTest("dev.ftb.mods:${ld('ftb-library')}:${project.ftb_library_version}")
    testImplementation(platform('org.junit:junit-bom:5.11.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    if (legacy) {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
        // core nests MixinExtras for every module (they all require core)
        if (project.module_id == 'quest_clusters') {
            implementation("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}")
            jarJar("io.github.llamalad7:mixinextras-forge") {
                version { strictly "[${project.mixinextras_version},)"; prefer project.mixinextras_version }
            }
        }
    }
}

def mixinConfig = "${project.module_id}.mixins.json"
def hasMixins = new File(moduleDir, "src/main/resources/$mixinConfig").exists()
// 1.20.1-only mixins (backports such as chapter image ids) have their own config in src/forge/resources
def forgeMixinConfig = "${project.module_id}.forge.mixins.json"
// only configs that list mixins (the bundle's is empty: no refmap would be written for it)
def listsMixins = { File f ->
    if (!f.exists()) return false
    def json = new groovy.json.JsonSlurper().parse(f)
    return ['mixins', 'client', 'server'].any { json[it] instanceof List && !json[it].isEmpty() }
}
def mixinConfigs = [mixinConfig, forgeMixinConfig].findAll { listsMixins(new File(moduleDir, it == forgeMixinConfig ? "src/forge/resources/$it" : "src/main/resources/$it")) }
if (legacy && !mixinConfigs.isEmpty()) {
    // Forge 47 reads mixin configs from the mod's manifest. Dev runs load mods from their output folders (not on
    // the launch classpath, so --mixin.config cannot find them): those get a manifest file in the resources too.
    mixin {
        add sourceSets.main, "${project.module_id}.refmap.json"
    }
    tasks.named('jar') {
        manifest.attributes(['MixinConfigs': mixinConfigs.join(',')])
        exclude 'META-INF/MANIFEST.MF'
    }
    // a dev mod is its classes and resources folders together; write the manifest into both
    def writeManifest = { File dir ->
        def mf = new File(dir, 'META-INF/MANIFEST.MF')
        mf.parentFile.mkdirs()
        mf.text = "Manifest-Version: 1.0\nMixinConfigs: ${mixinConfigs.join(',')}\n"
    }
    tasks.named('processResources', ProcessResources) {
        inputs.property('mixinConfigs', mixinConfigs.join(','))
        doLast { writeManifest(destinationDir) }
    }
    tasks.named('compileJava', JavaCompile) {
        inputs.property('mixinConfigs', mixinConfigs.join(','))
        doLast { writeManifest(destinationDirectory.get().asFile) }
    }
}

// mod metadata: META-INF/neoforge.mods.toml (1.21.1) or META-INF/mods.toml (1.20.1), from gradle/templates
def depsFile = new File(moduleDir, 'extra-dependencies.toml')
/** NeoForge's dependency 'type' to Forge 47's 'mandatory'; incompatible/discouraged are checked in code there. */
def forgeDeps = { String text ->
    text.split(/(?=\[\[dependencies)/).collect { block ->
        if (block =~ /type\s*=\s*"(incompatible|discouraged)"/) return block.startsWith('[[') ? '' : block
        block.replaceAll(/type\s*=\s*"required"/, 'mandatory = true').replaceAll(/type\s*=\s*"optional"/, 'mandatory = false')
                .replaceAll(/(?m)^reason\s*=.*\n/, '')
    }.join('')
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def extra = depsFile.exists() ? depsFile.getText('UTF-8')
            .replace('${module_id}', project.module_id).replace('${mod_version}', rootProject.mod_version)
            .replace('${ftb_filter_system_version_range}', project.ftb_filter_system_version_range)
            .replace('${ftb_xmod_compat_version_range}', project.ftb_xmod_compat_version_range) : ''
    def props = [
            minecraft_version_range : project.minecraft_version_range,
            loader_range            : legacy ? project.forge_version_range : project.neo_version_range,
            loader_version_range    : project.loader_version_range,
            mod_license             : rootProject.mod_license,
            mod_version             : rootProject.mod_version,
            mod_authors             : rootProject.mod_authors,
            ftb_quests_version_range: project.ftb_quests_version_range,
            module_id               : project.module_id,
            module_name             : project.module_name,
            module_description      : project.module_description,
            // client-only modules use IGNORE_ALL_VERSION so servers don't need them
            display_test            : project.findProperty('display_test') ?: 'MATCH_VERSION',
            // placeholders inside the inserted text are not expanded by the template engine: resolve them here
            extra_dependencies      : legacy ? forgeDeps(extra) : extra,
            has_mixins              : hasMixins,
            // NeoForge-only mixins (src/neoforge/resources/<id>.neoforge.mixins.json)
            loader_mixins           : !legacy && new File(moduleDir, "src/neoforge/resources/${project.module_id}.neoforge.mixins.json").exists()
                    ? "\n[[mixins]]\nconfig = \"${project.module_id}.neoforge.mixins.json\"\n" : ''
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    expand props
    from rootProject.file(legacy ? 'gradle/templates-forge' : 'gradle/templates')
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
mdg.ideSyncTask generateModMetadata

// 1.20.1 runs Mixin with Java 17 and needs the refmap named in the config
if (legacy) {
    tasks.named('processResources', ProcessResources) {
        def refmap = "${project.module_id}.refmap.json"
        filesMatching('*.mixins.json') {
            filter { String line ->
                line.replace('"JAVA_21"', '"JAVA_17"')
                        .replaceFirst(/^(\s*)"package"/, "\$1\"refmap\": \"$refmap\",\n\$1\"package\"")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { showStandardStreams = true }
    // optional local-only fixture (a private quest book): -PlegacyBook=/path/to/config/ftbquests/quests
    if (project.hasProperty('legacyBook')) {
        systemProperty 'quest_clusters.legacyBook', project.property('legacyBook')
        outputs.upToDateWhen { false }
    }
}

// test-only textures used by the in-game self-tests stay out of release jars (dev runs read the resources folder)
tasks.named('jar') {
    exclude 'assets/*/textures/devtest/**'
}
