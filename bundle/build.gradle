apply from: rootProject.file('gradle/module.gradle')

// nest every module that is marked publish=true (except this one), built for the same Minecraft version
def nested = ['core', 'visuals', 'editor', 'filters', 'xmod'].findAll { project(":$it").findProperty('publish') == 'true' }
nested.each { evaluationDependsOn(":$it:$mc") }

dependencies {
    nested.each { jarJar(sibling(it)) }
}

tasks.named('jar') {
    archiveClassifier = ''
}
